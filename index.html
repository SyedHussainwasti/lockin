<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro — focus timer</title>
<!-- all the page styling lives in styles.css -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- the timer card in the middle of the page -->
<div class="card">
  <!-- the title -->
  <h1><span>◉</span> Pomodoro</h1>
  <!-- the small label showing the current phase (Ready / Focus / Break...) -->
  <div id="phase">Ready</div>
  <!-- the progress ring with the time in the middle -->
  <div class="ring">
    <svg viewBox="0 0 230 230">
      <circle class="bg" cx="115" cy="115" r="100"></circle>
      <circle class="fg" id="ringFg" cx="115" cy="115" r="100"></circle>
    </svg>
    <div id="time">25:00</div>
  </div>
  <!-- the Start/Pause and Reset buttons -->
  <div class="controls">
    <button id="startBtn" type="button">Start</button>
    <button id="resetBtn" type="button">Reset</button>
  </div>
  <!-- the settings: work minutes and break minutes -->
  <div class="settings">
    <label>Work (min)<input id="workLen" type="number" min="1" max="180" value="25"></label>
    <label>Break (min)<input id="breakLen" type="number" min="1" max="60" value="5"></label>
  </div>
  <!-- the finished-sessions counter -->
  <div id="cycles">Completed work sessions: <b id="cycleCount">0</b></div>
</div>
<!-- all the page logic lives in app.js -->
<script src="app.js"></script>
</body>
</html>
